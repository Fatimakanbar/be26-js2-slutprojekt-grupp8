<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <button id="homeButton">Tillbaka till översikten</button>

    <h1 id="projectHeader">Projekt namn</h1>
    <p id="projectDescription">Projekt beskrivning:</p>
    <p id="projectDeadline">Deadline:</p>
    <h2>Projektmedlemmar</h2>
    <div id="projectMembers"></div>

   
    <div id="taskFormContainer"></div>
    <button id="addTaskBtn">Lägg till uppgift</button>
     <label for="filterTasksByCategory">Filtrera:</label>
    <select id="filterTasksByCategory">
      <option value="deadline-desc">UX</option>
      <option value="deadline-asc">Frontend</option>
      <option value="deadline-xx">Backend</option>
    </select>

    <label for="sortTasks">Sortera:</label>
    <select id="sortTasks">
      <option value="deadline-desc">Deadline ↓</option>
      <option value="deadline-asc">Deadline ↑</option>
      <option value="title-asc">Titel A → Ö</option>
      <option value="title-desc">Titel Ö → A</option>
    </select>
    <div id="taskBoard">
      <section class="task-column">
        <h2>Nya uppgifter</h2>
        <div id="newTasksContainer"></div>
      </section>

      <section class="task-column">
        <h2>Pågående uppgifter</h2>
        <div id="ongoingTasksContainer"></div>
      </section>

      <section class="task-column">
        <h2>Avslutade uppgifter</h2>
        <div id="doneTasksContainer"></div>
      </section>
    </div>

    <script type="module" src="/src/Views/Project.ts"></script>
    <script type="module" src="/src/Views/TaskBoard.ts"></script>
  </body>
</html>
